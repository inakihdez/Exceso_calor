name: Backfill histórico AEMET (24 meses)

on:
  workflow_dispatch: {}  # solo manual, no programado — se usa una vez (o para reconstruir el histórico)

permissions:
  contents: write  # necesario para comitear de vuelta el histórico actualizado

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar backfill AEMET
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u aemet_backfill_historico.py

      - name: Comitear histórico actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aemet_temperatura_maxima_mensual.json
          git diff --quiet --cached || git commit -m "Backfill histórico temperatura máxima AEMET (24 meses)"
          git push
