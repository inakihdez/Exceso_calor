name: Informe mensual AEMET (temperatura máxima)

on:
  schedule:
    # Día 1 de cada mes a las 07:00 UTC
    - cron: '0 7 1 * *'
  workflow_dispatch: {}  # permite lanzarlo manualmente desde la pestaña Actions para probar

permissions:
  contents: write  # necesario para comitear de vuelta el histórico actualizado

jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar informe AEMET
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u aemet_monthly_report.py

      - name: Comitear histórico actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aemet_temperatura_maxima_mensual.json
          git diff --quiet --cached || git commit -m "Actualiza histórico temperatura máxima AEMET"
          git push
