name: Informe mensual MoMo

on:
  schedule:
    # Día 1 de cada mes a las 07:00 UTC (≈ 08:00-09:00 hora peninsular según horario de verano/invierno)
    - cron: '0 7 1 * *'
  workflow_dispatch: {}  # permite lanzarlo manualmente desde la pestaña Actions para probar

jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pandas requests

      - name: Ejecutar informe MoMo
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python momo_monthly_report.py
